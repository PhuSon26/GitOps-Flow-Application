apiVersion: v1
kind: PersistentVolume
metadata:
  name: monitoring-pv
spec:
  capacity:
    storage: 10Gi

  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce

  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-storage

  mountOptions:
    - nfsvers=4.1

  nfs:
    server: 192.168.212.101
    path: /data/monitoring